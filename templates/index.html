<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись к мастеру {{ master_name }}</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            min-height: 100vh;
        }
        .header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--tg-theme-hint-color, #e0e0e0);
        }
        .master-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .master-info {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #666666);
            line-height: 1.5;
        }
        .step { margin-bottom: 24px; }
        .step-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .date-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .date-card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .date-card.selected {
            background: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #ffffff);
            transform: scale(0.98);
        }
        .date-day { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .date-month { font-size: 12px; opacity: 0.8; }
        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .time-card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
            font-size: 16px;
            font-weight: 500;
        }
        .time-card.selected {
            background: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .time-card.unavailable {
            background: #f0f0f0;
            color: #999;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .services-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 16px; }
        .service-category {
            margin-top: 16px;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--tg-theme-hint-color, #666666);
        }
        .service-item {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .service-item.selected {
            background: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .service-info { flex: 2; }
        .service-name { font-weight: 500; margin-bottom: 4px; }
        .service-duration { font-size: 12px; opacity: 0.7; }
        .service-price { font-weight: 600; font-size: 16px; margin-left: 16px; }
        .total-info {
            font-size: 16px;
            font-weight: 600;
            text-align: right;
            margin: 16px 0;
            padding: 16px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
        }
        .total-details { display: flex; justify-content: space-between; align-items: center; }
        .total-price { font-size: 18px; color: var(--tg-theme-button-color, #40a7e3); }
        .total-time { font-size: 14px; color: var(--tg-theme-hint-color, #666666); }
        .warning-message {
            background: #ffeb3b;
            color: #000;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            font-weight: 500;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-control {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--tg-theme-hint-color, #e0e0e0);
            border-radius: 10px;
            font-size: 16px;
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .button {
            background: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            margin-top: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .button:disabled { opacity: 0.5; cursor: not-allowed; }
        .button.secondary {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
            margin-top: 8px;
        }
        .hidden { display: none !important; }
        .summary {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .summary-label { color: var(--tg-theme-hint-color, #666666); }
        .summary-value { font-weight: 500; }
        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 0 8px;
        }
        .progress-step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            position: relative;
        }
        .progress-step.active {
            background: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .progress-step.completed { background: #4CAF50; color: white; }
        .progress-line {
            flex: 1;
            height: 2px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            margin: 14px 4px 0 4px;
        }
        .progress-line.active { background: var(--tg-theme-button-color, #40a7e3); }
    </style>
</head>
<body>
    <div class="header">
        <div class="master-name">{{ master_name }}</div>
        <div class="master-info">
            📍 {{ address }}<br>
            📞 {{ phone }}
        </div>
    </div>

    <div id="app">
        <div class="progress-bar">
            <div class="progress-step" id="step1-indicator">1</div>
            <div class="progress-line" id="step1-line"></div>
            <div class="progress-step" id="step2-indicator">2</div>
            <div class="progress-line" id="step2-line"></div>
            <div class="progress-step" id="step3-indicator">3</div>
            <div class="progress-line" id="step3-line"></div>
            <div class="progress-step" id="step4-indicator">4</div>
        </div>

        <div id="step1" class="step">
            <div class="step-title">📅 Выберите дату</div>
            <div id="dateGrid" class="date-grid"></div>
        </div>

        <div id="step2" class="step hidden">
            <div class="step-title">⏰ Выберите время</div>
            <div id="timeGrid" class="time-grid"></div>
        </div>

        <div id="step3" class="step hidden">
            <div class="step-title">💅 Выберите услуги</div>
            <div id="servicesList" class="services-grid"></div>
            <div id="totalInfo" class="total-info">
                <div class="total-details"><span>Итого:</span><span class="total-price" id="totalPrice">0₽</span></div>
                <div class="total-details"><span>Время:</span><span class="total-time" id="totalTime">0 мин</span></div>
            </div>
            <div id="timeWarning" class="warning-message hidden"></div>
        </div>

        <div id="step4" class="step hidden">
            <div class="step-title">👤 Ваши данные</div>
            <div class="summary">
                <div class="summary-item"><span class="summary-label">Дата:</span><span class="summary-value" id="summaryDate"></span></div>
                <div class="summary-item"><span class="summary-label">Время:</span><span class="summary-value" id="summaryTime"></span></div>
                <div class="summary-item"><span class="summary-label">Длительность:</span><span class="summary-value" id="summaryDuration"></span></div>
                <div class="summary-item"><span class="summary-label">Услуги:</span><span class="summary-value" id="summaryServices"></span></div>
                <div class="summary-item"><span class="summary-label">Итого:</span><span class="summary-value" id="summaryTotal"></span></div>
            </div>
            <div class="form-group"><label>Ваше имя</label><input type="text" id="clientName" class="form-control" placeholder="Например: Анна"></div>
            <div class="form-group"><label>Номер телефона</label><input type="tel" id="clientPhone" class="form-control" placeholder="+7 (999) 123-45-67"></div>
        </div>

        <button id="nextBtn" class="button">Далее</button>
        <button id="backBtn" class="button secondary hidden">Назад</button>
        <button id="confirmBtn" class="button hidden">✅ Подтвердить запись</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();

        let currentStep = 1;
        let dates = [];
        let selectedDate = null;
        let selectedTime = null;
        let selectedServices = [];
        let services = [];
        let availableTimes = [];

        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            await loadServices();
            await loadDates();
            updateStepIndicators();
        }

        async function loadServices() {
            try {
                const response = await fetch('/api/services');
                services = await response.json();
            } catch (error) { console.error('Ошибка загрузки услуг:', error); }
        }

        async function loadDates() {
            try {
                const response = await fetch('/api/dates');
                dates = await response.json();
                renderDates();
            } catch (error) {
                console.error('Ошибка загрузки дат:', error);
                document.getElementById('dateGrid').innerHTML = '<p style="text-align: center; padding: 20px;">😔 Ошибка загрузки</p>';
            }
        }

        async function loadTimes(date) {
            try {
                const response = await fetch(`/api/times/${date}`);
                availableTimes = await response.json();
                renderTimes();
            } catch (error) {
                console.error('Ошибка загрузки времени:', error);
                availableTimes = [];
            }
        }

        function renderDates() {
            const grid = document.getElementById('dateGrid');
            grid.innerHTML = '';
            if (dates.length === 0) {
                grid.innerHTML = '<p style="text-align: center; padding: 20px;">😔 Нет доступных дат</p>';
                return;
            }
            dates.forEach(item => {
                const card = document.createElement('div');
                card.className = 'date-card' + (selectedDate === item.date ? ' selected' : '');
                card.onclick = () => selectDate(item.date);
                const day = new Date(item.date).getDate();
                const month = new Date(item.date).toLocaleString('ru', { month: 'short' });
                card.innerHTML = `<div class="date-day">${day}</div><div class="date-month">${month}</div>`;
                grid.appendChild(card);
            });
        }

        async function selectDate(date) {
            selectedDate = date;
            selectedTime = null;
            renderDates();
            await loadTimes(date);
            goToStep(2);
        }

        function renderTimes() {
            const grid = document.getElementById('timeGrid');
            grid.innerHTML = '';

            if (availableTimes.length === 0) {
                grid.innerHTML = '<p style="text-align: center; padding: 20px;">😔 Нет свободного времени</p>';
                return;
            }

            availableTimes.forEach(time => {
                const card = document.createElement('div');
                card.className = 'time-card' + (selectedTime === time ? ' selected' : '');
                card.textContent = time;
                card.onclick = () => selectTime(time);
                grid.appendChild(card);
            });
        }

        function selectTime(time) {
            selectedTime = time;
            renderTimes();
            document.getElementById('nextBtn').disabled = false;
        }

        async function checkAvailability(date, startTime, services) {
            try {
                const response = await fetch('/api/check-time', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date: date, start_time: startTime, services: services })
                });
                const result = await response.json();
                return result.available;
            } catch (error) { console.error('Ошибка проверки доступности:', error); return false; }
        }

        function renderServices() {
            const container = document.getElementById('servicesList');
            container.innerHTML = '';
            
            const browServices = services.slice(0, 7);
            const makeupServices = services.slice(7);
            
            const browsHeader = document.createElement('div'); 
            browsHeader.className = 'service-category'; 
            browsHeader.textContent = '👁️ БРОВИ'; 
            container.appendChild(browsHeader);
            
            browServices.forEach(service => addServiceItem(container, service));
            
            const makeupHeader = document.createElement('div'); 
            makeupHeader.className = 'service-category'; 
            makeupHeader.textContent = '💄 МАКИЯЖ'; 
            container.appendChild(makeupHeader);
            
            makeupServices.forEach(service => addServiceItem(container, service));
            
            updateTotal();
        }

        function addServiceItem(container, service) {
            const div = document.createElement('div');
            div.className = 'service-item' + (selectedServices.includes(service.name) ? ' selected' : '');
            div.onclick = () => toggleService(service.name);
            div.innerHTML = `<div class="service-info"><div class="service-name">${service.name}</div><div class="service-duration">⏱️ ${service.duration} мин</div></div><div class="service-price">${service.price}₽</div>`;
            container.appendChild(div);
        }

        async function toggleService(serviceName) {
            const index = selectedServices.indexOf(serviceName);
            if (index === -1) selectedServices.push(serviceName);
            else selectedServices.splice(index, 1);
            renderServices();
            
            if (selectedDate && selectedTime && selectedServices.length > 0) {
                const available = await checkAvailability(selectedDate, selectedTime, selectedServices);
                const warningEl = document.getElementById('timeWarning');
                if (!available) {
                    const totalDuration = selectedServices.reduce((sum, name) => sum + (services.find(s => s.name === name)?.duration || 0), 0);
                    warningEl.textContent = `⚠️ Выбранные услуги (${totalDuration} мин) не помещаются в это время. Попробуйте другое время.`;
                    warningEl.classList.remove('hidden');
                } else {
                    warningEl.classList.add('hidden');
                }
            }
            document.getElementById('nextBtn').disabled = selectedServices.length === 0;
        }

        function updateTotal() {
            const total = selectedServices.reduce((sum, name) => sum + (services.find(s => s.name === name)?.price || 0), 0);
            const totalMinutes = selectedServices.reduce((sum, name) => sum + (services.find(s => s.name === name)?.duration || 0), 0);
            document.getElementById('totalPrice').textContent = `${total}₽`;
            document.getElementById('totalTime').textContent = `${totalMinutes} мин`;
        }

        function updateSummary() {
            const dateObj = dates.find(d => d.date === selectedDate);
            document.getElementById('summaryDate').textContent = dateObj ? dateObj.display : selectedDate;
            document.getElementById('summaryTime').textContent = selectedTime;
            const totalMinutes = selectedServices.reduce((sum, name) => sum + (services.find(s => s.name === name)?.duration || 0), 0);
            document.getElementById('summaryDuration').textContent = `${totalMinutes} мин`;
            document.getElementById('summaryServices').textContent = selectedServices.join(', ');
            const total = selectedServices.reduce((sum, name) => sum + (services.find(s => s.name === name)?.price || 0), 0);
            document.getElementById('summaryTotal').textContent = total + '₽';
        }

        function goToStep(step) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step4').classList.add('hidden');
            document.getElementById(`step${step}`).classList.remove('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('confirmBtn').classList.add('hidden');

            if (step === 1) {
                document.getElementById('backBtn').classList.add('hidden');
                document.getElementById('nextBtn').textContent = 'Далее';
                document.getElementById('nextBtn').disabled = !selectedDate;
            } else if (step === 2) {
                document.getElementById('nextBtn').textContent = 'Далее';
                document.getElementById('nextBtn').disabled = !selectedTime;
            } else if (step === 3) {
                document.getElementById('nextBtn').textContent = 'Далее';
                document.getElementById('nextBtn').disabled = selectedServices.length === 0;
                renderServices();
            } else if (step === 4) {
                document.getElementById('nextBtn').classList.add('hidden');
                document.getElementById('confirmBtn').classList.remove('hidden');
                document.getElementById('backBtn').classList.remove('hidden');
                updateSummary();
            }

            currentStep = step;
            updateStepIndicators();
        }

        function updateStepIndicators() {
            for (let i = 1; i <= 4; i++) {
                const indicator = document.getElementById(`step${i}-indicator`);
                const line = document.getElementById(`step${i}-line`);
                if (i < currentStep) {
                    indicator.className = 'progress-step completed';
                    indicator.textContent = '✓';
                    if (line) line.className = 'progress-line active';
                } else if (i === currentStep) {
                    indicator.className = 'progress-step active';
                    indicator.textContent = i;
                    if (line) line.className = 'progress-line active';
                } else {
                    indicator.className = 'progress-step';
                    indicator.textContent = i;
                    if (line) line.className = 'progress-line';
                }
            }
        }

        document.getElementById('nextBtn').onclick = async () => {
            if (currentStep === 1 && selectedDate) {
                goToStep(2);
            } else if (currentStep === 2 && selectedTime) {
                goToStep(3);
            } else if (currentStep === 3 && selectedServices.length > 0) {
                const available = await checkAvailability(selectedDate, selectedTime, selectedServices);
                if (available) {
                    goToStep(4);
                } else {
                    tg.showAlert('❌ Выбранное время не подходит для этих услуг. Попробуйте другое время.');
                }
            }
        };

        document.getElementById('backBtn').onclick = () => { if (currentStep > 1) goToStep(currentStep - 1); };

        document.getElementById('confirmBtn').onclick = async () => {
            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            if (!name || !phone) { tg.showAlert('Пожалуйста, заполните все поля'); return; }

            const available = await checkAvailability(selectedDate, selectedTime, selectedServices);
            if (!available) { tg.showAlert('❌ К сожалению, это время уже занято. Выберите другое.'); return; }

            const total = selectedServices.reduce((sum, name) => sum + (services.find(s => s.name === name)?.price || 0), 0);

            const bookingData = {
                user_id: tg.initDataUnsafe.user?.id || 0,
                username: tg.initDataUnsafe.user?.username || "",
                name: name,
                phone: phone,
                date: selectedDate,
                start_time: selectedTime,
                services: selectedServices,
                total_price: total
            };

            tg.MainButton.setText('Отправка...'); tg.MainButton.show();

            try {
                const response = await fetch('/api/book', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bookingData) });
                const result = await response.json();
                if (result.success) { 
                    tg.showAlert('✅ Запись успешно создана!'); 
                    tg.close(); 
                } else { 
                    tg.showAlert('❌ Ошибка: ' + result.error); 
                    tg.MainButton.hide(); 
                }
            } catch (error) { 
                console.error('Ошибка:', error); 
                tg.showAlert('❌ Произошла ошибка при отправке'); 
                tg.MainButton.hide(); 
            }
        };

        tg.ready();
    </script>
</body>
</html>
